# =============================================================================
# 首页（hero 版式）配置
#
# 这里放的是「可选项」与「默认值」。访客在首页右上角齿轮面板里的选择会写进浏览器
# localStorage，并覆盖这里的默认值 —— 也就是说，改这个文件决定的是"默认长什么样"，
# 而不是锁死访客看到的画面。
#
# 改完需要重新构建（pnpm build）才会出现在页面上。
# =============================================================================

# 背景图。本地图片放在 public/ 下，path 不带扩展名。
# 约定：同一张图提供 -960 与 -1920 两个宽度，组件据此拼 srcset 做响应式加载。
# 自己加图时按同样命名放两份（例如 mypic-960.webp / mypic-1920.webp）即可。
#
# 动态壁纸用 url 而不是 path：完整的图片地址，每次显示时由浏览器实时拉取。
#   bing-daily  必应每日精选（当天固定，次日自动换新）
#   bing-random 必应随机壁纸（每次拉取都不同，配合轮换间隔可自动换）
# 接口：https://api.bimg.cc（302 跳转到真实图片，可直接作为 <img> 源）
background:
  images:
    - id: coast
      name: 海岸黄昏
      path: /image/home/coast
    - id: mist
      name: 云雾山峦
      path: /image/home/mist
    - id: lake
      name: 静湖森林
      path: /image/home/lake
    - id: elk-valley
      name: 晨雾河谷
      path: /image/home/elk-valley
    - id: lighthouse-coast
      name: 灯塔风暴
      path: /image/home/lighthouse-coast
    - id: brighton-jetty
      name: 落日栈桥
      path: /image/home/brighton-jetty
    - id: loughrigg-tarn
      name: 山谷晨光
      path: /image/home/loughrigg-tarn
    - id: milky-way
      name: 海岸银河
      path: /image/home/milky-way
    - id: sunbeams
      name: 云海森林
      path: /image/home/sunbeams
    - id: earth-clouds
      name: 轨道云海
      path: /image/home/earth-clouds
    - id: bing-daily
      name: 必应今日
      url: "https://api.bimg.cc/today?w=1920&h=1080&mkt=zh-CN"
    - id: bing-random
      name: 必应随机
      url: "https://api.bimg.cc/random?w=1920&h=1080&mkt=zh-CN"

  # 默认使用哪一张（填上面的 id）。留空或填了不存在的 id 时用第一张。
  default: coast

  # 轮换方式。三选一：
  #   不轮换：none        只显示访客选中的那张（没选过就是上面的 default）
  #   每日：  daily       当天固定一张，次日自动换
  #   每次刷新：refresh   每次打开页面随机一张
  #   定时间隔：填秒数    如 30 表示每 30 秒换一张
  # 注意 0 在这里等同于 none（背景有明确的默认图，0 不该被理解成"每页随机"）。
  interval: none

# 「随机一言」。items 留空则首页不渲染这张卡片。
quotes:
  items:
    - text: 道虽迩，不行不至；事虽小，不为不成。
      author: 《荀子·修身》
    - text: 不积跬步，无以至千里；不积小流，无以成江海。
      author: 《荀子·劝学》
    - text: 吾生也有涯，而知也无涯。
      author: 《庄子·养生主》
    - text: 博观而约取，厚积而薄发。
      author: 苏轼《稼说送张琥》
    - text: 苟日新，日日新，又日新。
      author: 《礼记·大学》
    - text: 把简单的事做到极致，就是不简单。
      author: 自勉

  # 轮换方式，与背景同款取值：none / daily / refresh / 秒数。
  # 注意 0 在这里等同于 refresh（改动前脚本每次进页面都会先随机一条，
  # 这只是把当时的实际行为写成了明确的字面量）。
  interval: 30

# 法定节假日与调休补班。日历上「休」标红、「班」标蓝。
#
# dates 支持两种写法：
#   - 单个日期： "2026-01-04"
#   - 闭区间：   "2026-02-15..2026-02-23"（含首尾）
#
# 每年国务院公布安排后在这里更新即可，不需要改代码。
# 以下为 2026 年的安排，来源：国办发明电〔2025〕7 号。
holidays:
  rests:
    - name: 元旦
      dates: ["2026-01-01..2026-01-03"]
    - name: 春节
      dates: ["2026-02-15..2026-02-23"]
    - name: 清明节
      dates: ["2026-04-04..2026-04-06"]
    - name: 劳动节
      dates: ["2026-05-01..2026-05-05"]
    - name: 端午节
      dates: ["2026-06-19..2026-06-21"]
    - name: 中秋节
      dates: ["2026-09-25..2026-09-27"]
    - name: 国庆节
      dates: ["2026-10-01..2026-10-07"]

  works:
    - name: 元旦调休
      dates: ["2026-01-04"]
    - name: 春节调休
      dates: ["2026-02-14", "2026-02-28"]
    - name: 劳动节调休
      dates: ["2026-05-09"]
    - name: 国庆调休
      dates: ["2026-09-20", "2026-10-10"]

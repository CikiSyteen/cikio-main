# =============================================================================
# 首页（hero 版式）配置
#
# 这里放的是「可选项」与「默认值」。访客在首页右上角齿轮面板里的选择会写进浏览器
# localStorage，并覆盖这里的默认值 —— 也就是说，改这个文件决定的是"默认长什么样"，
# 而不是锁死访客看到的画面。
#
# 改完需要重新构建（pnpm build）才会出现在页面上。
# =============================================================================

# 背景图。图片放在 public/ 下，path 不带扩展名。
# 约定：同一张图提供 -960 与 -1920 两个宽度，组件据此拼 srcset 做响应式加载。
# 自己加图时按同样命名放两份（例如 mypic-960.webp / mypic-1920.webp）即可。
background:
  images:
    - id: coast
      name: 海岸黄昏
      path: /image/home/coast
    - id: mist
      name: 云雾山峦
      path: /image/home/mist
    - id: lake
      name: 静湖森林
      path: /image/home/lake

  # 默认使用哪一张（填上面的 id）。留空或填了不存在的 id 时用第一张。
  default: coast

  # 背景自动轮换间隔（秒）。0 = 不自动轮换（只显示访客选中的那张）。
  interval: 0

# 「随机一言」。items 留空则首页不渲染这张卡片。
quotes:
  items:
    - text: 道虽迩，不行不至；事虽小，不为不成。
      author: 《荀子·修身》
    - text: 不积跬步，无以至千里；不积小流，无以成江海。
      author: 《荀子·劝学》
    - text: 吾生也有涯，而知也无涯。
      author: 《庄子·养生主》
    - text: 博观而约取，厚积而薄发。
      author: 苏轼《稼说送张琥》
    - text: 苟日新，日日新，又日新。
      author: 《礼记·大学》
    - text: 把简单的事做到极致，就是不简单。
      author: 自勉

  # 默认轮换间隔（秒）。0 = 不自动轮换（每次进页面随机一条）。
  interval: 30

# 法定节假日与调休补班。日历上「休」标红、「班」标蓝。
#
# dates 支持两种写法：
#   - 单个日期： "2026-01-04"
#   - 闭区间：   "2026-02-15..2026-02-23"（含首尾）
#
# 每年国务院公布安排后在这里更新即可，不需要改代码。
# 以下为 2026 年的安排，来源：国办发明电〔2025〕7 号。
holidays:
  rests:
    - name: 元旦
      dates: ["2026-01-01..2026-01-03"]
    - name: 春节
      dates: ["2026-02-15..2026-02-23"]
    - name: 清明节
      dates: ["2026-04-04..2026-04-06"]
    - name: 劳动节
      dates: ["2026-05-01..2026-05-05"]
    - name: 端午节
      dates: ["2026-06-19..2026-06-21"]
    - name: 中秋节
      dates: ["2026-09-25..2026-09-27"]
    - name: 国庆节
      dates: ["2026-10-01..2026-10-07"]

  works:
    - name: 元旦调休
      dates: ["2026-01-04"]
    - name: 春节调休
      dates: ["2026-02-14", "2026-02-28"]
    - name: 劳动节调休
      dates: ["2026-05-09"]
    - name: 国庆调休
      dates: ["2026-09-20", "2026-10-10"]

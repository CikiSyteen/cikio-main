# =============================================================================
# 「友链」配置（/friend 页的「友链」区块）
#
# 互换链接的朋友站点。每项四个字段：
#   name        站点 / 博主名（卡片标题）
#   avatar      头像图片地址：站内图填 / 开头的路径（放在 public/ 下），也可填完整 https 地址
#   description 一句话简介（卡片副标题，建议 40 字以内，过长会被截断）
#   url         站点地址（点击卡片跳转）
#
# 留空（items 为空数组）时页面显示「还没有添加友链」的占位提示。
# 本文件可选：删掉它等同于留空，不会报错。
# 改完需要重新构建（pnpm build）才会出现在页面上。
# =============================================================================

items: []
# 写法示例（去掉上面的 [] 再照抄即可）：
# items:
#   - name: 示例博客
#     avatar: "https://example.com/avatar.png"
#     description: 一个写技术笔记的小站
#     url: "https://example.com"

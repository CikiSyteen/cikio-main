  - text: 休息一下，马上回来~
  - text: 让我们做一个普通的好人！
  - text: 幸福是什么？——拥有苹果的时候只想着苹果
  - text: 摘下最喜欢的麦穗，然后闭眼穿过整个麦田
  - text: 从此不必借光而行，你我皆是星辰
  - text: 新时代的少年们，你们将撑起这个民族的荣光！
  - text: 一双筷子夹起东南西北菜，一声不要客气道尽人间暖意。
  - text: 一碗一碟盛装四季团圆，一桌一椅围坐唠不完的家常。
  - text: 把自己珍视很久的东西留给他人，仿佛留下了自己的一部分伴他同行
  - text: 愿世界和平

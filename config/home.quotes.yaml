items:
  - text: 道虽迩，不行不至；事虽小，不为不成。
  - text: 不积跬步，无以至千里；不积小流，无以成江海。
  - text: 吾生也有涯，而知也无涯。
  - text: 博观而约取，厚积而薄发。
  - text: 苟日新，日日新，又日新。
  - text: 把简单的事做到极致，就是不简单。
  - text: 我想我们是见过面的。在卷子里，在笔锋下，在电视上，在人间里。
  - text: 世界是一场盛大的交错，而两颗星恰好停在彼此的轨道。从此，运转有了参照，光年有了意义。
  - text: 一个人的力量是有限的，而一群人的力量是无限的。
  - text: 一直向西走，越过晨昏线，越过日界线，回到初识你的那一天。
  - text: 我会假装不在意，直到我真的不在意。
  - text: 有的人注定只能陪你走一段，但是你会带着被ta改变的那部分东西继续往前走。
  - text: 我应该闭眼，因为我不忍。我应该睁眼，因为要铭记。
  - text: 有多少人被困在了2020，困在了时间和记忆里...他们是人民共和国的英雄！
  - text: 每天早上醒来你有两个选择:一是盖上被子继续做你没做完的梦，二是掀开被子去完成你未完成的梦。
  - text: 你让我看到了生命的坚韧，我为你感到骄傲。
  - text: 记住吗？记住了？哭完了？哭完了很好，你也是英雄了。
  - text: 救人是美德，不是用利益来衡量的，科技可以停滞，美德不能丢。
  - text: 思想从来不在笔下，思想在符号之间流淌，思想从来只在文字之外、之上。
  - text: 忠犬易老，盲目难明；稚童良言，最暖三冬。
  - text: 历史的厚重扑面而来，那是来自人民群众的厚度。
  - text: 请把我埋在最像故乡的地方。
  - text: 麦子熟了几千次，人民万岁第一次。
  - text: 继续前行，迈向黎明。我们永不忘却。
  - text: 这个世界太大，大到我穷极一生都无法走遍：这个世界太小，小到我一生都将被困于这里。
  - text: 高铁很快，肩负着复兴之梦，火车很慢，承载着万家灯火。快起来是中国速度，而慢下来却是中国温度；因为有“和谐”，才有“复兴”。
  - text: 我们开创文明，我们传承文明，周而复始，生生不息。
  - text: 上船不思岸上人，下船不提船上事。旧人无需知近况，新人不必问过往。
  - text: 我不知道他们为谁而生，但我知道他们为我而死。
  - text: 生活就像一块巧克力，我们永远无法得知下一块是什么味道。
  - text: 新年到了我就来了，鞭炮响了我就走了，好像我才是那年兽。
  - text: 故乡承载不了肉体，远方承载不了灵魂，终是故乡的阑珊灯火，映不出远方的星辰闪烁。
  - text: 我听闻，善行若只止于一人，不过暖一人之心；若有人将它记录下来，使千百人都看见，便又多了一层意义。
  - text: 这段旅程不长不短，正好是我在那片小世界里的一生。
  - text: 愿你们在暗下去的星盘后，都有着光一般的人生。
  - text: 声音的传播需要时间，我们面对面说着话。我在过去，你在未来。
  - text: 并非每个人都可以成为伟大的艺术家，但伟大的艺术家可以来自每一个角落。
  - text: 理想主义的迷人之处不在于他总会胜利，而是在于失败之后，依然生生不息！
  - text: 因止而知行的方向，因息而有生的能量。
  - text: 没有一个冬天不可逾越，没有一个春天不会到来。
  - text: 入夜春宵里，暇望寂玄空；银花火树散，漫天暖人情。
  - text: 我的故乡，好像一下子清晰了起来，也一下子苍老了起来，像一张旧报纸，越揉越小。
  - text: 樱间春烟，华光叹此
  - text: 历史书太薄，装不下他们的伟大，我们随手一翻，就是他们的一生……
  - text: Father And Mother I Love You 爸爸妈妈我爱你们
  - text: 如果把人生换算成24小时，那么童年就是一场梦，但睡眠质量是会影响一天生活的。
  - text: "千言万语，汇成一句：\n“我想找你，种一棵树”"
  - text: 画质越来越清晰，童年却越来越模糊了。
  - text: 文臣最高的成就是什么？——十里长街
  - text: 清澈的爱，只为中国

# =============================================================================
# 首页「随机一言」配置
#
# items 留空则首页不渲染这张卡片。
# 本文件可选：删掉它首页就不显示一言卡片。
# =============================================================================

items:
  - text: 道虽迩，不行不至；事虽小，不为不成。
    author: 《荀子·修身》
  - text: 不积跬步，无以至千里；不积小流，无以成江海。
    author: 《荀子·劝学》
  - text: 吾生也有涯，而知也无涯。
    author: 《庄子·养生主》
  - text: 博观而约取，厚积而薄发。
    author: 苏轼《稼说送张琥》
  - text: 苟日新，日日新，又日新。
    author: 《礼记·大学》
  - text: 把简单的事做到极致，就是不简单。
    author: 自勉

# 一言已改为固定「每次刷新随机一条」，不再提供轮换设置项；此处的 interval
# 仅作文档说明，实际行为由组件写死为 refresh。
interval: refresh

  - text: 我的学生都战死了，现在该我这个老师上了！
  - text: 原来…打败魔王的钥匙，就藏在童谣里…
  - text: 你也只活了一次，凭什么我选择的人生是错的？
  - text: 死亡不是终点，遗忘才是
  - text: 叫高山低头，叫河水让路！
  - text: 致敬每一个认真生活的人！
  - text: 想放弃的时候想想当初为什么开始
  - text: 你当初那股不服输的劲哪去了？
  - text: 知不可乎骤得，托遗响于悲风

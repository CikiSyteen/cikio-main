# =============================================================================
# 「项目」页配置（/project）
#
# 页面自上而下三段，每段都可以单独删除，删掉对应区块就不再渲染：
#   featured  精选项目：一张仓库概览卡（星标 / 复刻 / 关注 / 创建与更新时间）
#   repos     我的仓库：仓库卡片网格（名称、简介、语言、星标实时来自 GitHub）
#   more      底部的「在 GitHub 查看更多」按钮
#
# 仓库信息全部实时请求 GitHub API 获取，这里只需要写「仓库名」，
# 不需要也不应该在这里写简介、星标数这类会过期的内容。
#
# 本文件可选：整个删掉时 /project 页只保留标题卡，不会报错。
# 改完需要重新构建（pnpm build）才会出现在页面上。
# =============================================================================

# GitHub 用户名。下面各节的仓库都写在这个账号下，换账号时只改这一处。
owner: CikiSyteen

# 精选项目：页面顶部的大卡。repo 只写仓库名（作者取上面的 owner）。
# 不要这节就整段注释掉或删除。
featured:
  repo: sky-stones

# 我的仓库：卡片网格，按数组顺序展示。
# 想加项目就在这里追加一项；pinned 为 true 时卡片右上角显示「已置顶」。
repos:
  - repo: cikio-main
    pinned: false
  - repo: sky-stones
    pinned: true
  - repo: BuyWise
    pinned: false
  - repo: ciki-hub
    pinned: false

# 底部跳转按钮。不要按钮就删掉这一节。
more:
  text: 在 GitHub 查看更多
  url: "https://github.com/CikiSyteen?tab=repositories"

# =============================================================================
# 「友站」配置（/friend 页的「友站」区块）
#
# 与「友链」的区别：友站渲染成一行小徽章（带在线状态检测），
# 只展示站点名与域名，没有头像和简介，适合收录自己的其他站点或常逛的站。
#
# 每项两个字段：
#   name  站点名（徽章上的文字）
#   url   站点地址；徽章会用 HEAD 请求实时探测，绿点=在线、红点=离线
#
# 留空时页面显示占位提示；本文件可选，删掉等同于留空。
# 改完需要重新构建（pnpm build）才会出现在页面上。
# =============================================================================

items: []
# 写法示例：
# items:
#   - name: Cikio
#     url: "https://www.cikio.cn"

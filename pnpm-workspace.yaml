packages:
  - "."

allowBuilds:
  esbuild: true
  "@parcel/watcher": true

peerDependencyRules:
  allowedVersions:
    astro: "^7.0.0"

# overrides 说明（2026-09-20）
# 这里不是"固定版本"，而是把「已确认存在漏洞的传递依赖」抬到官方已修复版本。
# 每条都按受影响的大版本区间限定作用域（如 sharp@0.35），
# 因此不会误伤使用其它大版本的消费者。
# 依据来源：pnpm audit 输出的 vulnerable_versions / patched_versions。
overrides:
  "diff@4": ^4.0.4 # GHSA-73rr-hh4g-fpgx        < @astrojs/tailwind>postcss-load-config
  "ajv@8": ^8.18.0 # GHSA-px8p-9vwx-vf98        < @astrojs/check>@astrojs/language-server
  "yaml@2": ^2.8.3 # GHSA-9rgm-9g3h-6x36        < tailwindcss / postcss-load-config
  "deepmerge-ts@7": ^8.0.0 # GHSA-ggr8-5vv4-36mx       < @playform/compress
  "postcss-selector-parser@6": ^6.1.3 # GHSA-w9m9-85wc-3x92   < tailwindcss / expressive-code
  "browserslist@4": ^4.28.7 # GHSA-c83g-rgw3-j3cx，GHSA-73wf-gq98-2v4g  < @astrojs/tailwind>autoprefixer
  "fast-uri@3": ^3.1.6 # GHSA-4vpr-x523-8j87        < @astrojs/check>@astrojs/language-server
  "fflate@0.7": ^0.7.5 # GHSA-376h-93r7-7g6f        < satori
  "baseline-browser-mapping@2": ^2.11.0 # GHSA-w5vr-8v7q-w6rv       < @astrojs/tailwind>autoprefixer
  "sharp@0.35": ^0.35.4 # GHSA-rgj7-g3m4-5g8c        < @playform/compress
  # 注意：不升到 js-yaml 5 —— astro 内部 helper 使用 4.x 的默认导出，跨大版本会直接崩
  "js-yaml@4": ^4.3.2 # GHSA-2883-xcg3-v3hh        < astro>@astrojs/internal-helpers
  "svgo@4": ^4.1.0 # GHSA-w27v-7q3p-w38r        < @playform/compress
  "devalue@5": ^5.9.1 # GHSA-jmr9-qjv8-65gv        < astro

onlyBuiltDependencies:
  - esbuild
  - "@parcel/watcher"

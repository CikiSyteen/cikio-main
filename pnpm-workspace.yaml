packages:
  - "."

allowBuilds:
  esbuild: true
  "@parcel/watcher": true

peerDependencyRules:
  allowedVersions:
    astro: "^7.0.0"

# 注意：模板原有的 overrides 已全部移除（2026-09-20）。
# 那些锁定值来自模板早期（如 svgo 固定在 3.x），而 astro 7.3.3 已改用 svgo@^4，
# 继续沿用会把依赖降级并重新引入已修复的漏洞。改为让各依赖使用自己声明的版本，
# 由 pnpm audit 与 lockfile 保证安全与一致性。

onlyBuiltDependencies:
  - esbuild
  - "@parcel/watcher"

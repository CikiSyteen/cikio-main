# 网站的基本信息
site:
  tab: Cikio # 浏览器标签栏上显示的文本
  title: Cikio # 网站的标题
  description: Cikio — CikiSyteen 的个人博客，记录开发实践与技术笔记。 # 网站的描述，用于SEO等
  language: zh # 网站的语言，例如 "en" 是英文
  favicon: /favicon.svg # 网站的图标，用于浏览器标签栏和其他地方显示
  theme: # 更多主题 https://daisyui.com/docs/themes/
    light: winter # 主题的浅色模式
    dark: dracula # 主题的深色模式
    code: github-dark # 代码块的主题 https://expressive-code.com/guides/themes/
  date_format: YYYY年M月D日 ddd # 日期格式设置，支持自定义格式（zh locale 下 ddd 会是"周日"）
  blog: # 博客相关配置
    pageSize: 8 # 每页显示的文章数量
  menu: # 菜单配置
    - id: home # 菜单项的唯一标识符
      text: 首页 # 菜单项显示的文本
      href: / # 菜单项链接的地址
      svg: "material-symbols:home-outline-rounded"
      target: _self
    - id: about
      text: 关于
      href: /about
      svg: "material-symbols:info-outline-rounded"
      target: _self
    - id: blog
      text: 博客
      href: /blog
      svg: "material-symbols:book-2-outline-rounded"
      target: _self
      subItems:
        - id: all
          text: 所有博客
          href: /blog
          svg: "material-symbols:ink-pen-outline-rounded"
          target: _self
        # 注意：这两个子菜单指向的是"分类页"，href 里的分类名
        # 必须与文章 frontmatter 的 categories 完全一致（2026-09-23 已随内容一起中文化）。
        # 浏览器会自动把中文编码成 %E6%96%87%E6%A1%A3 这类形式，无需手写编码。
        - id: documentation
          text: 文档
          href: /blog/category/文档
          svg: "material-symbols:unknown-document-outline-rounded"
          target: _self
        - id: examples
          text: 示例
          href: /blog/category/示例
          svg: "material-symbols:deployed-code-outline"
          target: _self
        # 子菜单项配置
    - id: project
      text: 项目
      href: /project
      svg: "material-symbols:code-blocks-outline"
      target: _self
    - id: friend
      text: 友链
      href: /friend
      svg: "material-symbols:supervisor-account-outline-rounded"
      target: _self

# 用户的个人信息
user:
  name: CikiSyteen # 用户名
  site: "https://www.cikio.cn" # 用户的网站链接（同时作为 astro 的 site：canonical / sitemap / RSS / OG 的基准 URL）
  avatar: /profile.png # 用户头像路径
  bio: "" # 个人简介（显示在侧栏头像下方，留空则整行不显示）
  # 首页天气小组件（可选）。数据来自 Open-Meteo 的免费接口：HTTPS、无需密钥、无需注册。
  # 不需要天气就把 enabled 改成 false（首页只保留日期与时间）。
  # city 只是界面上的文案，真正查询的是 latitude / longitude，换城市时两个都要改。
  weather:
    enabled: true
    city: 上海
    latitude: 31.2304
    longitude: 121.4737
  sidebar: # 侧边栏配置
    social:
      - href: "https://afdian.com/a/CikiSyteenIsHere" # 链接
        ariaLabel: Support my work # 图标的可访问性标签
        title: Support my work # 图标的悬浮标题
        svg: "ri:cup-line"
      - href: "https://github.com/CikiSyteen"
        ariaLabel: Github
        title: Github
        svg: "ri:github-line"
      - href: "https://space.bilibili.com/1417882550"
        ariaLabel: BiliBili
        title: BiliBili
        svg: "ri:bilibili-line"
      - href: "mailto:ciki2099@foxmail.com"
        ariaLabel: Email
        title: Email
        svg: "ri:mail-line"
  footer:
    social:
      - href: "https://afdian.com/a/CikiSyteenIsHere" # 链接
        ariaLabel: Support my work # 图标的可访问性标签
        title: Support my work # 图标的悬浮标题
        svg: "ri:cup-line"
      - href: "https://github.com/CikiSyteen"
        ariaLabel: Github
        title: Github
        svg: "ri:github-line"
      - href: "https://space.bilibili.com/1417882550"
        ariaLabel: BiliBili
        title: BiliBili
        svg: "ri:bilibili-line"
      - href: "mailto:ciki2099@foxmail.com"
        ariaLabel: Email
        title: Email
        svg: "ri:mail-line"
